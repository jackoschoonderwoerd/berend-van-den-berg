<div class="gallery">
    <div class="image-container"
        (click)="openGallery()">

        <img [src]="galleryStore.galleryImages()[0].src"

        <div class="gallery-icon">
            <mat-icon>photo_library</mat-icon>
        </div>

    </div>
</div>
