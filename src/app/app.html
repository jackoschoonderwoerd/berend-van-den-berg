<mat-sidenav-container>

    <mat-sidenav mode="over"
        position="end"
        [opened]="navigationStore.sidenavOpen()"
        (openedChange)="navigationStore.setSidenavOpen($event)">

        <app-sidenav />

    </mat-sidenav>

    <mat-sidenav-content #scrollContainer
        (scroll)="onScroll($event)">

        <app-header [class.header-hidden]="headerHidden()" />

        <main>
            <router-outlet />
            <app-footer />
        </main>

    </mat-sidenav-content>

</mat-sidenav-container>
